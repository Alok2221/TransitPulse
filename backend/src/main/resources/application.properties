spring.application.name=TransitPulse
server.port=8080

spring.datasource.url=jdbc:sqlite:transitpulse.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Legal open data integrations (no API keys)
transitpulse.osrm.base-url=https://router.project-osrm.org
transitpulse.open-meteo.base-url=https://api.open-meteo.com
transitpulse.open-meteo.geocoding-url=https://geocoding-api.open-meteo.com

# Fuel model — configurable average (no scraping of station sites)
transitpulse.fuel.pln-per-liter=6.55
transitpulse.fuel.liters-per-100km=7.0
transitpulse.car.amortization-per-km=0.35
transitpulse.car.parking-pln=25.0
